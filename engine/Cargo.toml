[package]
name = "osc8-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OSC-8 audio engine (wavetable synth + sequencer), compiled to wasm32-unknown-unknown"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
